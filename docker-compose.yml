services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - analytics-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  analytics-data:
